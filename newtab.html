<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Nova aba</title>
    <link rel="stylesheet" href="/src/newtab.css" />
  </head>
  <body class="carregando">
    <button id="alternar-lateral" type="button" title="Recolher barra lateral" aria-label="Recolher barra lateral">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <rect x="2" y="3" width="14" height="12" rx="2" /><line x1="7" y1="3" x2="7" y2="15" />
      </svg>
    </button>

    <aside id="lateral">
      <button id="nova-nota" type="button">+ Nova nota</button>
      <input id="busca" type="search" placeholder="Buscar notas" aria-label="Buscar notas" />
      <ul id="lista-notas"></ul>
    </aside>

    <main id="area">
      <div id="editor"></div>
    </main>

    <script type="module" src="/src/newtab.ts"></script>
  </body>
</html>
