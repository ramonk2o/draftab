<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Nova aba</title>
    <link rel="stylesheet" href="/src/newtab.css" />
  </head>
  <body class="carregando">
    <button id="alternar-lateral" type="button" title="Recolher barra lateral" aria-label="Recolher barra lateral">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2.5" width="12" height="11" rx="2" /><path d="M6 2.5v11" />
      </svg>
    </button>

    <aside id="lateral">
      <div class="linha-busca">
        <label class="campo-busca">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="7" cy="7" r="4.25" /><path d="m10.25 10.25 3.25 3.25" />
          </svg>
          <input id="busca" type="search" placeholder="Buscar" aria-label="Buscar notas" />
        </label>
        <button id="nova-nota" type="button" title="Nova nota" aria-label="Nova nota">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M8 3v10" /><path d="M3 8h10" />
          </svg>
        </button>
      </div>
      <ul id="lista-notas"></ul>
    </aside>

    <main id="area">
      <div id="editor"></div>
    </main>

    <script type="module" src="/src/newtab.ts"></script>
  </body>
</html>
